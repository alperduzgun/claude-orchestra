# Ghostty keybindings for Claude Orchestra
# Add these to your ~/.config/ghostty/config
#
# IMPORTANT: These assume tmux prefix is Ctrl+A (\x01).
# If you use the default Ctrl+B prefix, replace \x01 with \x02 below.
#
# To set Ctrl+A as tmux prefix, add to your ~/.tmux.conf:
#   unbind C-b
#   set -g prefix C-a
#   bind C-a send-prefix
#
# Maps Cmd+0-9 to tmux prefix + number
# so you can switch tmux windows with Cmd+number

keybind = super+0=text:\x01\x30  # Cmd+0 → window 0
keybind = super+1=text:\x01\x31  # Cmd+1 → window 1
keybind = super+2=text:\x01\x32  # Cmd+2 → window 2
keybind = super+3=text:\x01\x33  # Cmd+3 → window 3
keybind = super+4=text:\x01\x34  # Cmd+4 → window 4
keybind = super+5=text:\x01\x35  # Cmd+5 → window 5
keybind = super+6=text:\x01\x36  # Cmd+6 → window 6
keybind = super+7=text:\x01\x37  # Cmd+7 → window 7
keybind = super+8=text:\x01\x38  # Cmd+8 → window 8
keybind = super+9=text:\x01\x39  # Cmd+9 → window 9
