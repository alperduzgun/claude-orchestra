# Orchestra tmux configuration
# Append to your ~/.tmux.conf or use as a starting point
#
# Includes: Ctrl+A prefix, Catppuccin Mocha theme, orchestra status bar,
# vim-style navigation, mouse support, and sensible defaults.

# Shell: zsh as login shell (loads .zprofile + .zshrc)
set -g default-shell /bin/zsh
set -g default-command "zsh -l"

# Prefix: Ctrl+A (more ergonomic than default Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Mouse
set -g mouse on

# Window index starts at 1
set -g base-index 1
setw -g pane-base-index 1

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation (vim style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# New window with current path
bind c new-window -c "#{pane_current_path}"

# History limit
set -g history-limit 50000

# Escape time (for neovim)
set -sg escape-time 0

# Status bar — Catppuccin Mocha theme with orchestra worker indicators
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S "
set -g status-left-length 30
set -g status-right "#(~/.local/bin/orchestra-status)#[fg=#a6adc8] %H:%M "
set -g status-right-length 80
set -g status-interval 5
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#45475a,fg=#cdd6f4,bold] #I:#W "

# Use latest client size (prevents smallest-window constraint)
set -g window-size latest
